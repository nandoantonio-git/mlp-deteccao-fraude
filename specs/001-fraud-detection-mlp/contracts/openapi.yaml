openapi: 3.0.3
info:
  title: CP4 Fraud Detection Prediction API
  version: 1.0.0
  description: Local prediction contract for one credit card transaction.
paths:
  /predict:
    post:
      summary: Predict whether one transaction is legitimate or fraudulent
      operationId: predictTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionInput'
            example:
              Time: 10.2
              V1: -1.35
              V2: -0.07
              V3: 2.53
              V4: 1.38
              V5: -0.34
              V6: 0.46
              V7: 0.24
              V8: 0.10
              V9: 0.36
              V10: 0.09
              V11: -0.55
              V12: -0.62
              V13: -0.99
              V14: -0.31
              V15: 1.47
              V16: -0.47
              V17: 0.20
              V18: 0.03
              V19: 0.40
              V20: 0.25
              V21: -0.02
              V22: 0.28
              V23: -0.11
              V24: 0.07
              V25: 0.13
              V26: -0.19
              V27: 0.13
              V28: -0.02
              Amount: 149.62
      responses:
        '200':
          description: Prediction returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionResult'
              example:
                prediction: 0
                label: legitima
                fraud_probability: 0.03
        '422':
          description: Invalid or incomplete transaction input
components:
  schemas:
    TransactionInput:
      type: object
      additionalProperties: false
      required:
        - Time
        - V1
        - V2
        - V3
        - V4
        - V5
        - V6
        - V7
        - V8
        - V9
        - V10
        - V11
        - V12
        - V13
        - V14
        - V15
        - V16
        - V17
        - V18
        - V19
        - V20
        - V21
        - V22
        - V23
        - V24
        - V25
        - V26
        - V27
        - V28
        - Amount
      properties:
        Time:
          type: number
        Amount:
          type: number
        V1:
          type: number
        V2:
          type: number
        V3:
          type: number
        V4:
          type: number
        V5:
          type: number
        V6:
          type: number
        V7:
          type: number
        V8:
          type: number
        V9:
          type: number
        V10:
          type: number
        V11:
          type: number
        V12:
          type: number
        V13:
          type: number
        V14:
          type: number
        V15:
          type: number
        V16:
          type: number
        V17:
          type: number
        V18:
          type: number
        V19:
          type: number
        V20:
          type: number
        V21:
          type: number
        V22:
          type: number
        V23:
          type: number
        V24:
          type: number
        V25:
          type: number
        V26:
          type: number
        V27:
          type: number
        V28:
          type: number
    PredictionResult:
      type: object
      required:
        - prediction
        - label
        - fraud_probability
      properties:
        prediction:
          type: integer
          enum: [0, 1]
        label:
          type: string
          enum: [legitima, fraude]
        fraud_probability:
          type: number
          minimum: 0
          maximum: 1
